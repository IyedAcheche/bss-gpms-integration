# Production-style stack: nginx is the only public entry; Postgres is internal only.
#
# Pull published images (after merge to main):
#   docker login
#   docker compose -f docker-compose.deploy.yml pull
#   docker compose -f docker-compose.deploy.yml up -d
#
# Override tags (default app-latest / proxy-latest):
#   BRAZOS_APP_IMAGE_TAG=app-sha-abc1234 BRAZOS_PROXY_IMAGE_TAG=proxy-sha-abc1234 \
#     docker compose -f docker-compose.deploy.yml up -d
#
# Local build instead of Hub (no pull):
#   docker compose -f docker-compose.deploy.yml up -d --build
#
# Requires .env with GPMS_EMAIL / GPMS_PASSWORD (DATABASE_URL overridden below).

services:
  postgres:
    image: postgres:16-alpine
    container_name: brazos-gpms-postgres
    restart: always
    environment:
      POSTGRES_USER: brazos
      POSTGRES_PASSWORD: brazos
      POSTGRES_DB: brazos_gpms
    volumes:
      - brazos_gpms_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U brazos -d brazos_gpms"]
      interval: 10s
      timeout: 5s
      retries: 5

  app:
    image: ${DOCKER_IMAGE:?Set DOCKER_IMAGE in .env}:${BRAZOS_APP_IMAGE_TAG:-app-latest}
    build:
      context: .
    container_name: brazos-gpms-app
    restart: always
    expose:
      - "8080"
    env_file:
      - .env
    environment:
      DATABASE_URL: postgresql+psycopg2://brazos:brazos@postgres:5432/brazos_gpms
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test:
        [
          "CMD",
          "python",
          "-c",
          "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8080/health', timeout=5)",
        ]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 90s

  proxy:
    image: ${DOCKER_IMAGE:?Set DOCKER_IMAGE in .env}:${BRAZOS_PROXY_IMAGE_TAG:-proxy-latest}
    build:
      context: ./proxy
    container_name: brazos-gpms-proxy
    restart: always
    ports:
      - "8080:8080"
    environment:
      LISTEN_PORT: "8080"
      APP_HOST: app
      APP_PORT: "8080"
      DOMAIN: ${GPMS_DOMAIN:-localhost}
    depends_on:
      app:
        condition: service_healthy
    healthcheck:
      test:
        [
          "CMD",
          "wget",
          "-qO-",
          "http://127.0.0.1:8080/health",
        ]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 10s

volumes:
  brazos_gpms_pgdata:

# Run tests on PRs; push app + proxy tags to Docker Hub on merge to main.
#
# Image repo (no tag): set GitHub repository variable DOCKER_IMAGE
#   e.g. mycompany/brazos-gmps-app  or  registry.example.com/gpms/brazos-gmps-app
# Tags: app-latest, proxy-latest, app-sha-<short>, proxy-sha-<short>
# Platforms: linux/amd64, linux/arm64 (Apple Silicon + typical Linux VMs)
#
# Secrets: DOCKERHUB_USERNAME, DOCKERHUB_TOKEN (registry credentials)

name: CI and Docker publish

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

env:
  PLATFORMS: linux/amd64,linux/arm64

jobs:
  test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: brazos
          POSTGRES_PASSWORD: brazos
          POSTGRES_DB: brazos_gpms
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U brazos -d brazos_gpms"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 5
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run pytest
        env:
          TEST_DATABASE_URL: postgresql+psycopg2://brazos:brazos@localhost:5432/brazos_gpms
        run: pytest

  docker-build:
    runs-on: ubuntu-latest
    needs: test
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-qemu-action@v3

      - uses: docker/setup-buildx-action@v3

      - name: Build app image (multi-platform, no push)
        uses: docker/build-push-action@v6
        with:
          context: .
          file: Dockerfile
          platforms: ${{ env.PLATFORMS }}
          push: false
          tags: brazos-gpms-app:app-ci
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Build proxy image (multi-platform, no push)
        uses: docker/build-push-action@v6
        with:
          context: ./proxy
          file: proxy/Dockerfile
          platforms: ${{ env.PLATFORMS }}
          push: false
          tags: brazos-gpms-app:proxy-ci
          cache-from: type=gha
          cache-to: type=gha,mode=max

  docker-push:
    runs-on: ubuntu-latest
    needs: [test, docker-build]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    env:
      IMAGE: ${{ vars.DOCKER_IMAGE }}
    steps:
      - name: Require DOCKER_IMAGE repository variable
        run: |
          if [ -z "${IMAGE}" ]; then
            echo "::error::Set GitHub repo variable DOCKER_IMAGE (e.g. mycompany/brazos-gmps-app). Push skipped until configured."
            exit 1
          fi

      - uses: actions/checkout@v4

      - uses: docker/setup-qemu-action@v3

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Docker metadata (app)
        id: meta-app
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.IMAGE }}
          tags: |
            type=raw,value=app-latest
            type=sha,prefix=app-sha-,format=short

      - name: Push app image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: Dockerfile
          platforms: ${{ env.PLATFORMS }}
          push: true
          tags: ${{ steps.meta-app.outputs.tags }}
          labels: ${{ steps.meta-app.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Docker metadata (proxy)
        id: meta-proxy
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.IMAGE }}
          tags: |
            type=raw,value=proxy-latest
            type=sha,prefix=proxy-sha-,format=short

      - name: Push proxy image
        uses: docker/build-push-action@v6
        with:
          context: ./proxy
          file: proxy/Dockerfile
          platforms: ${{ env.PLATFORMS }}
          push: true
          tags: ${{ steps.meta-proxy.outputs.tags }}
          labels: ${{ steps.meta-proxy.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
